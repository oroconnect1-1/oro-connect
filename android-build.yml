name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build Web Application
        run: |
          npm run build --if-present
          mkdir -p www

      - name: Initialize Capacitor and Android
        run: |
          if [ ! -d "android" ]; then
            npx cap init "ORO-CONNECT" "com.oroconnect.app" --web-dir www
            npx cap add android
          fi

      - name: Generate App Icons
        run: |
          mkdir -p assets
          if [ -f "www/icon.png" ]; then
            cp www/icon.png assets/icon.png
            npx capacitor-assets generate --android
          else
            echo "Icon file not found, skipping icon generation."
          fi
      - name: Setup Firebase Configuration
        run: |
          if [ -d "android/app" ]; then
            # Failii google-services.json jedhu yoo root keessa jiraate gara android/app/ tti gadi dabarsa
            if [ -f "google-services.json" ]; then
              cp google-services.json android/app/google-services.json
            else
              echo "Warning: google-services.json missing. Required for Firebase!"
            fi
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORO-CONNECT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

